name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

jobs:
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: plugin

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Built file matches src/
        run: |
          cat src/*.js > /tmp/built.js
          diff -q /tmp/built.js universal-3d-cards.js
      - name: JavaScript syntax
        run: node --check universal-3d-cards.js
